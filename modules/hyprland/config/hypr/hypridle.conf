general {
    lock_cmd = hyprlock
    before_sleep_cmd = hyprlock
}

# 3 menit : Redupin layar
listener {
    timeout = 180
    on-timeout = ~/.config/hypr/scripts/idle-check.sh "brightnessctl -s set 10%-"
    on-resume = brightnessctl -r
}

# 30 menit : Matiin layar pas IDLE normal
listener {
    timeout = 1800
    on-timeout = ~/.config/hypr/scripts/idle-check.sh "hyprctl dispatch dpms off | hyprlock"
    on-resume = hyprctl dispatch dpms on
}

